<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radial Aura -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080d" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial Linear Gradients -->
    <linearGradient id="primaryOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e9d5ff"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="celestialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>

  <!-- Outer Astrolabe Coordinate Ring -->
  <circle cx="32" cy="32" r="27" stroke="url(#primaryOrbit)" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 4"/>
  
  <!-- Outer Ring Cardinal Notches -->
  <circle cx="32" cy="5" r="1.5" fill="#facc15" />
  <circle cx="32" cy="59" r="1.5" fill="#facc15" />
  <circle cx="5" cy="32" r="1.5" fill="#38bdf8" />
  <circle cx="59" cy="32" r="1.5" fill="#38bdf8" />

  <!-- Tilted Gyroscopic Orbit Rings (Astrological Spheres) -->
  <ellipse cx="32" cy="32" rx="23" ry="10" transform="rotate(-35 32 32)" stroke="url(#primaryOrbit)" stroke-width="1.4" stroke-opacity="0.75"/>
  <ellipse cx="32" cy="32" rx="23" ry="10" transform="rotate(35 32 32)" stroke="url(#primaryOrbit)" stroke-width="1.4" stroke-opacity="0.75"/>

  <!-- Orbiting Celestial Nodes -->
  <circle cx="16" cy="20" r="1.8" fill="#fef08a" filter="url(#celestialGlow)"/>
  <circle cx="48" cy="44" r="1.8" fill="#38bdf8" filter="url(#celestialGlow)"/>

  <!-- Middle Sacred Octagram Ray Ring -->
  <polygon points="32,15 36,28 49,32 36,36 32,49 28,36 15,32 28,28" fill="none" stroke="url(#goldAccent)" stroke-width="1" stroke-opacity="0.55"/>

  <!-- Central Celestial Starburst (Core Emblem) -->
  <path d="M 32 10 
           C 32 22 22 32 10 32 
           C 22 32 32 42 32 54 
           C 32 42 42 32 54 32 
           C 42 32 32 22 32 10 Z" 
        fill="url(#starGradient)" 
        filter="url(#celestialGlow)"
        opacity="0.95"/>

  <!-- Inner Astrological File Node / Quantum Diamond -->
  <rect x="27.5" y="27.5" width="9" height="9" rx="2" transform="rotate(45 32 32)" fill="#0b0d14" stroke="#fef08a" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="2" fill="#38bdf8" filter="url(#celestialGlow)"/>
</svg>
